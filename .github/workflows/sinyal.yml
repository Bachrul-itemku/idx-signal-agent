name: Sinyal Saham IDX

on:
  schedule:
    # Waktu dalam UTC (WIB = UTC+7). GitHub bisa molor 5–30 menit; main.py auto
    # memilih tugas sesuai jam WIB saat benar-benar jalan.
    - cron: "3-53/10 2-3 * * 1-5"   # 09.03–10.53 WIB tiap 10 menit: BPJS live
    - cron: "3 4 * * 1-5"           # 11.03 WIB: BPJS live terakhir
    - cron: "20 4 * * 1-5"          # 11.20 WIB: ringkasan BPJS live
    # BSJP: satu run panjang yang cek sendiri tiap ±10 menit 14.45–15.58 lalu kirim ringkasan.
    # Beberapa pemicu cadangan karena jadwal GitHub sering molor ±1 jam.
    - cron: "40 6 * * 1-5"          # 13.40 WIB
    - cron: "10 7 * * 1-5"          # 14.10 WIB
    - cron: "40 7 * * 1-5"          # 14.40 WIB
    - cron: "10 8 * * 1-5"          # 15.10 WIB
    - cron: "4 9 * * 1-5"           # 16.04 WIB: ringkasan BSJP (selalu dikirim)
    - cron: "47 11 * * 1-5"         # 18.47 WIB: swing + daftar BPJS besok
    - cron: "13 1 * * 6"            # Sabtu 08.13 WIB: evaluasi mingguan + ganti resep otomatis
  workflow_dispatch:
    inputs:
      perintah:
        description: "scan, bpjs, bsjp, loop-bsjp, evaluasi, stats, riset, auto, ringkasan-bsjp, ringkasan-bpjs, bsjp-uji, bpjs-uji"
        default: scan

permissions:
  contents: write

concurrency:
  group: sinyal
  cancel-in-progress: false

defaults:
  run:
    working-directory: idx-signal-agent   # semua file Python ada di folder ini

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: idx-signal-agent/requirements.txt

      - run: pip install -r requirements.txt

      - name: Jalankan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          UNIVERSE: ${{ vars.UNIVERSE }}
          MODAL_RP: ${{ vars.MODAL_RP }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          AUTO_SWITCH: ${{ vars.AUTO_SWITCH }}
          SKIP_STALE: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          JADWAL="${{ github.event.schedule }}"
          PERINTAH="${{ inputs.perintah }}"
          if [ "$JADWAL" = "13 1 * * 6" ]; then
            python main.py evaluasi
          elif [ -n "$JADWAL" ]; then
            python main.py auto
          else
            python main.py "${PERINTAH:-scan}"
          fi

      - name: Simpan jurnal & daftar saham
        run: |
          for f in signals.db tickers.txt strategi.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git config user.name "sinyal-bot"
            git config user.email "sinyal-bot@users.noreply.github.com"
            git commit -m "Update jurnal/strategi $(date -u +%F)"
            git pull --rebase -q || true
            git push
          fi
