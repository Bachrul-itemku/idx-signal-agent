name: Sinyal Saham IDX

on:
  schedule:
    - cron: "47 11 * * 1-5"   # Senin–Jumat 18.47 WIB
    - cron: "13 13 * * 5"     # Jumat 20.13 WIB: rapor winrate
  workflow_dispatch:
    inputs:
      perintah:
        description: "scan atau stats"
        default: scan

permissions:
  contents: write

concurrency:
  group: sinyal
  cancel-in-progress: false

defaults:
  run:
    working-directory: idx-signal-agent
    
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: idx-signal-agent/requirements.txt

      - run: pip install -r requirements.txt

      - name: Jalankan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          MODAL_RP: ${{ vars.MODAL_RP }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          SKIP_STALE: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          if [ "${{ github.event.schedule }}" = "13 13 * * 5" ] || [ "${{ inputs.perintah }}" = "stats" ]; then
            python main.py stats
          else
            python main.py
          fi

      - name: Simpan jurnal (signals.db)
        run: |
          if [ -f signals.db ] && [ -n "$(git status --porcelain signals.db)" ]; then
            git config user.name "sinyal-bot"
            git config user.email "sinyal-bot@users.noreply.github.com"
            git add signals.db
            git commit -m "Update jurnal sinyal $(date -u +%F)"
            git push
          fi
