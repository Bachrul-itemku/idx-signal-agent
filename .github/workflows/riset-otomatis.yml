name: Riset otomatis mingguan

on:
  schedule:
    - cron: "13 14 * * 5"     # Jumat 21.13 WIB (setelah bursa tutup & scan malam)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riset
  cancel-in-progress: false

jobs:
  riset:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: idx-signal-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: idx-signal-agent/requirements.txt
      - run: pip install -r requirements.txt
      - name: Riset & pilih aturan terbaik
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py riset-otomatis
      - name: Simpan strategi.json
        run: |
          if [ -n "$(git status --porcelain strategi.json)" ]; then
            git config user.name "sinyal-bot"
            git config user.email "sinyal-bot@users.noreply.github.com"
            git add strategi.json
            git commit -m "Riset otomatis $(date -u +%F): perbarui aturan BSJP/BPJS"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
          fi
