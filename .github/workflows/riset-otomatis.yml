name: Evaluasi mingguan (BSJP, BPJS, swing)

on:
  schedule:
    - cron: "13 0 * * 6"      # Sabtu 07.13 WIB: riset BSJP/BPJS + evaluasi swing
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riset
  cancel-in-progress: false

jobs:
  riset:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: idx-signal-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: idx-signal-agent/requirements.txt
      - run: pip install -r requirements.txt

      - name: Ambil jurnal & strategi terbaru (hindari salinan lama dari pemicu yang antre)
        run: git fetch -q --depth=1 origin main && git reset -q --hard FETCH_HEAD
      - name: Pilih cara terbaik (winrate tertinggi) untuk BSJP, BPJS, swing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py mingguan
      - name: Simpan strategi.json & jurnal
        run: |
          if [ -n "$(git status --porcelain strategi.json signals.db)" ]; then
            git config user.name "sinyal-bot"
            git config user.email "sinyal-bot@users.noreply.github.com"
            for f in strategi.json signals.db; do if [ -f "$f" ]; then git add "$f"; fi; done
            git commit -m "Evaluasi mingguan $(date -u +%F): perbarui aturan"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
          fi
